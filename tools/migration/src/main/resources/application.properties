spring.application.name=jforum-migration
spring.main.web-application-type=none
spring.main.banner-mode=off
# Legacy source (override with --spring.datasource.url=jdbc:sqlserver://host:1433;databaseName=jforum;encrypt=false ...)
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
# Target
spring.data.mongodb.uri=mongodb://localhost:27017/jforum
spring.data.mongodb.auto-index-creation=false
migration.batch-size=500
migration.drop-target=false
migration.dry-run=false
