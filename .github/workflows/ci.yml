name: CI
on:
  push:
    branches: [master, jforum-boot-rewrite]
  pull_request:
jobs:
  build:
    # mongo:8 (tcmalloc rseq bug, SERVER-121912) refuses to start on Linux kernel >= 6.19,
    # which ubuntu-latest/ubuntu-24.04 runners now ship; ubuntu-22.04 still has an older kernel.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Kernel version (mongo:8 needs < 6.19)
        run: uname -r
      - name: Build and test (Testcontainers MongoDB 8)
        run: ./mvnw -B verify
      - name: Docker image builds
        run: docker build -t jforum-boot:ci .
