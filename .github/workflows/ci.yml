name: CI
on:
  push:
    branches: [master, jforum-boot-rewrite]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Testcontainers MongoDB 8)
        run: ./mvnw -B verify
      - name: Docker image builds
        run: docker build -t jforum-boot:ci .
