name: CI
on:
  push:
    branches: [master, jforum-boot-rewrite]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Testcontainers MongoDB 8)
        # mongo:8.0 does not start on the runners' Linux kernel >= 6.19 (SERVER-121912); 8.2 does
        run: ./mvnw -B verify -Dmongodb.image=mongo:8.2
      - name: Docker image builds
        run: docker build -t jforum-boot:ci .
