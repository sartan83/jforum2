spring:
  application:
    name: jforum
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jforum}
      auto-index-creation: true
  freemarker:
    suffix: .ftlh
    content-type: text/html
    charset: UTF-8
    expose-request-attributes: true
    request-context-attribute: rc
    settings:
      template_exception_handler: rethrow
      number_format: computer
      output_format: HTMLOutputFormat
      api_builtin_enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  session:
    mongodb:
      collection-name: http_sessions
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 60m
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

jforum:
  # Any key of jforum/SystemGlobals.properties can be overridden as jforum.<key> (env: JFORUM_<KEY>)
  forum.link: ${FORUM_LINK:http://localhost:8080/}
  bootstrap:
    enabled: true
    admin-password: ${JFORUM_ADMIN_PASSWORD:admin}
  seed:
    demo: ${JFORUM_SEED_DEMO:false}

logging:
  level:
    net.jforum: INFO
